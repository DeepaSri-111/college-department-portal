apiVersion: apps/v1
kind: Deployment

metadata:
  name: college-department-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: college-department

  template:
    metadata:
      labels:
        app: college-department

    spec:
      containers:
        - name: college-department-container
          image: deepasri111/college-department-portal:latest
          ports:
            - containerPort: 80